[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-performance-toolkit"
version = "0.2.0"
description = "Linux kernel performance analysis: CPU scheduling, memory, NUMA locality, cache efficiency, page faults and huge pages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "nareshns2004" }]
keywords = ["linux", "kernel", "performance", "numa", "perf", "hugepages", "scheduler", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Operating System Kernels :: Linux",
]
dependencies = []  # standard library only, by design

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
kptk = "kptk.cli:main"

[project.urls]
Repository = "https://github.com/nareshns2004/kernel-performance-toolkit"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
